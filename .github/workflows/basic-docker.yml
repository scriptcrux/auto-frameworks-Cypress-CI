name: Docker Containerized Execution

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  cypress-docker-run:
    name: E2E Execution inside Cypress Docker Container
    runs-on: ubuntu-22.04
    container:
      image: cypress/browsers:latest
      options: --user 1001
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
