name: Sequential Cross-Browser Execution

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  cypress-sequential-run:
    runs-on: ubuntu-22.04
    name: Sequential Cross-Browser Testing
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Cypress Run (Chrome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Store Chrome Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots-chrome
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Store Chrome Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-chrome
          path: cypress/videos
          if-no-files-found: ignore

      - name: Cypress Run (Edge)
        uses: cypress-io/github-action@v6
        with:
          browser: edge
          headless: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Store Edge Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots-edge
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Store Edge Videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-edge
          path: cypress/videos
          if-no-files-found: ignore
